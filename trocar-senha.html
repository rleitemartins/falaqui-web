<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FalaQui — Trocar Senha</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #cf240a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    .title {
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .subtitle {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      margin-bottom: 32px;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .card h2 {
      color: #cf240a;
      font-size: 20px;
      margin-bottom: 6px;
    }
    .card p {
      color: #555;
      font-size: 14px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      color: #333;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      height: 52px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 16px;
      color: #222;
      background: #fafafa;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #cf240a; background: #fff; }
    .suffix {
      color: #cf240a;
      font-size: 13px;
      margin-top: -14px;
      margin-bottom: 18px;
    }
    button[type="submit"] {
      width: 100%;
      height: 52px;
      background: #cf240a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { background: #a81d08; }
    button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
    .msg {
      display: none;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      margin-top: 18px;
      text-align: center;
    }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error   { background: #ffebee; color: #c62828; display: block; }
    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #cf240a;
      font-size: 14px;
      text-decoration: none;
    }
    .footer {
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      margin-top: 32px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">🗨️</div>
  <div class="title">FalaQui</div>
  <div class="subtitle">Claudino.net</div>

  <div class="card">
    <h2>🔑 Trocar Senha</h2>
    <p>Informe seu usuário e a nova senha desejada. O administrador processará sua solicitação em breve.</p>

    <form id="form">
      <label>Usuário</label>
      <input type="text" id="usuario" name="usuario" placeholder="seu.nome" autocapitalize="none" autocorrect="off" required>
      <div class="suffix">@claudino.net</div>

      <label>Nova Senha</label>
      <input type="password" id="novaSenha" name="nova_senha" placeholder="••••••••" required minlength="6">

      <label>Confirme a Nova Senha</label>
      <input type="password" id="confirmarSenha" name="confirmar_senha" placeholder="••••••••" required minlength="6">

      <button type="submit" id="btnEnviar">SOLICITAR TROCA</button>

      <div id="msgSucesso" class="msg success">
        ✅ Solicitação enviada! O administrador irá redefinir sua senha em breve.
      </div>
      <div id="msgErro" class="msg error"></div>
    </form>

    <a class="voltar" href="javascript:history.back()">← Voltar ao FalaQui</a>
  </div>

  <div class="footer">FalaQui © Claudino.net</div>

  <script>
    // Preencher usuário se veio como parâmetro da URL
    const params = new URLSearchParams(window.location.search);
    const user = params.get('user');
    if (user) document.getElementById('usuario').value = user;

    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      const usuario = document.getElementById('usuario').value.trim();
      const nova = document.getElementById('novaSenha').value;
      const confirmar = document.getElementById('confirmarSenha').value;
      const msgErro = document.getElementById('msgErro');
      const msgSucesso = document.getElementById('msgSucesso');

      msgErro.style.display = 'none';
      msgSucesso.style.display = 'none';

      if (nova !== confirmar) {
        msgErro.textContent = '❌ As senhas não coincidem. Tente novamente.';
        msgErro.style.display = 'block';
        return;
      }
      if (nova.length < 6) {
        msgErro.textContent = '❌ A senha deve ter pelo menos 6 caracteres.';
        msgErro.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        // Enviar para Formspree (substitua YOUR_FORM_ID pelo ID real)
        const resp = await fetch('https://formspree.io/f/xgvkyknv', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            usuario: usuario + '@claudino.net',
            solicitacao: 'Troca de senha FalaQui',
            _subject: '[FalaQui] Troca de senha: ' + usuario + '@claudino.net'
          })
        });
        if (resp.ok) {
          msgSucesso.style.display = 'block';
          btn.textContent = 'ENVIADO ✓';
        } else {
          throw new Error('Erro no envio');
        }
      } catch(err) {
        btn.disabled = false;
        btn.textContent = 'SOLICITAR TROCA';
        msgErro.textContent = '❌ Erro ao enviar. Tente novamente ou contate o suporte.';
        msgErro.style.display = 'block';
      }
    });
  </script>
</body>
</html>
