<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FalaQui — Trocar Senha</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #cf240a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    .title { color: #fff; font-size: 24px; font-weight: bold; margin-bottom: 4px; }
    .subtitle { color: rgba(255,255,255,0.85); font-size: 14px; margin-bottom: 32px; text-align: center; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .card h2 { color: #cf240a; font-size: 20px; margin-bottom: 6px; }
    .card p { color: #555; font-size: 14px; margin-bottom: 24px; }
    label { display: block; color: #333; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .input-wrap { position: relative; margin-bottom: 6px; }
    input {
      width: 100%;
      height: 52px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 0 44px 0 16px;
      font-size: 16px;
      color: #222;
      background: #fafafa;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #cf240a; background: #fff; }
    input:disabled { background: #f0f0f0; color: #999; }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #888;
      padding: 4px;
    }
    .suffix { color: #cf240a; font-size: 13px; margin-bottom: 18px; margin-top: 4px; }
    .field-gap { margin-bottom: 18px; }
    button[type="submit"] {
      width: 100%;
      height: 52px;
      background: #cf240a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    button[type="submit"]:hover { background: #a81d08; }
    button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg {
      display: none;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      margin-top: 18px;
      text-align: center;
    }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error   { background: #ffebee; color: #c62828; display: block; }
    .footer { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 32px; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">🗨️</div>
  <div class="title">FalaQui</div>
  <div class="subtitle">Claudino.net</div>

  <div class="card">
    <h2>🔑 Trocar Senha</h2>
    <p>Informe seu usuário e escolha uma nova senha.</p>

    <form id="form">
      <label>Usuário</label>
      <div class="input-wrap">
        <input type="text" id="usuario" placeholder="seu.nome" autocapitalize="none" autocorrect="off" required>
      </div>
      <div class="suffix field-gap">@claudino.net</div>

      <label>Nova Senha</label>
      <div class="input-wrap field-gap">
        <input type="password" id="novaSenha" placeholder="••••••••" required minlength="6">
        <button type="button" class="eye-btn" onclick="toggleSenha('novaSenha', this)">👁️</button>
      </div>

      <label>Confirme a Nova Senha</label>
      <div class="input-wrap field-gap">
        <input type="password" id="confirmarSenha" placeholder="••••••••" required minlength="6">
        <button type="button" class="eye-btn" onclick="toggleSenha('confirmarSenha', this)">👁️</button>
      </div>

      <button type="submit" id="btnEnviar">SALVAR NOVA SENHA</button>

      <div id="msgSucesso" class="msg success" style="display:none">
        ✅ Senha alterada com sucesso! Volte ao app e faça login com a nova senha.
      </div>
      <div id="msgErro" class="msg error" style="display:none"></div>
    </form>

  </div>

  <div class="footer">FalaQui © Claudino.net</div>

  <script>
    const BASE_URL = 'https://app.claudino.net/services';
    const SVC_USER = 'cmd_ah_77851';
    const SVC_PASS = 'qP19J9WhT9zcjgZPZBcYKNga5YR7PPWUPokgscz0trvHlY96J3';

    // Preencher usuário se veio como parâmetro da URL
    const params = new URLSearchParams(window.location.search);
    const userParam = params.get('user');
    if (userParam) {
      const campo = document.getElementById('usuario');
      campo.value = userParam;
      campo.disabled = true; // usuário vem do app, não deve ser editado
    }

    function toggleSenha(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function mostrarErro(msg) {
      const el = document.getElementById('msgErro');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function esconderMensagens() {
      document.getElementById('msgErro').style.display = 'none';
      document.getElementById('msgSucesso').style.display = 'none';
    }

    async function obterToken() {
      const resp = await fetch(BASE_URL + '/sign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: SVC_USER, password: SVC_PASS })
      });
      if (!resp.ok) throw new Error('Falha ao autenticar serviço');
      const data = await resp.json();
      if (!data.token) throw new Error('Token não recebido');
      return data.token;
    }

    async function trocarSenha(token, userName, novaSenha) {
      const resp = await fetch(BASE_URL + '/changepassword', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ userName: userName, password: novaSenha })
      });
      const data = await resp.json();
      if (!data.success) throw new Error(data.message || 'Erro ao trocar senha');
      return data;
    }

    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      const usuario = document.getElementById('usuario').value.trim();
      const nova = document.getElementById('novaSenha').value;
      const confirmar = document.getElementById('confirmarSenha').value;

      esconderMensagens();

      if (!usuario) { mostrarErro('❌ Informe seu usuário.'); return; }
      if (nova !== confirmar) { mostrarErro('❌ As senhas não coincidem. Tente novamente.'); return; }
      if (nova.length < 6) { mostrarErro('❌ A senha deve ter pelo menos 6 caracteres.'); return; }

      // Bloquear formulário e mostrar loading
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Aguarde...';

      try {
        const token = await obterToken();
        await trocarSenha(token, usuario, nova);

        document.getElementById('msgSucesso').style.display = 'block';
        btn.textContent = 'SENHA ALTERADA ✓';

      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'SALVAR NOVA SENHA';

        if (err.message && err.message.toLowerCase().includes('network')) {
          mostrarErro('❌ Erro de conexão. Verifique sua internet e tente novamente.');
        } else if (err.message) {
          mostrarErro('❌ ' + err.message);
        } else {
          mostrarErro('❌ Erro inesperado. Tente novamente.');
        }
      }
    });
  </script>
</body>
</html>
